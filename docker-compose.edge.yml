services:
  brandmate-edge:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      BRANDMATE_DOMAIN: ${BRANDMATE_DOMAIN:-localhost}
      BRANDMATE_API_PORT: ${API_PORT:-7660}
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - ./apps/web:/srv:ro
      - brandmate-caddy-data:/data
      - brandmate-caddy-config:/config

volumes:
  # TLS certificates and keys must survive container recreation.
  brandmate-caddy-data:
  brandmate-caddy-config:
