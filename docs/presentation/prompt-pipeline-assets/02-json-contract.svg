<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#49372c" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d7785a"/></marker>
    <style>
      .title{font:700 48px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#332c28}
      .sub{font:400 23px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#756b64}
      .head{font:800 27px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#332c28}
      .code{font:600 20px Consolas,'Malgun Gothic',monospace;fill:#456351}
      .label{font:600 18px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#6d625c}
      .why{font:700 21px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#fbf7f1"/>
  <text x="105" y="110" class="title">JSON을 모델 간 공통 계약으로 사용</text>
  <text x="105" y="153" class="sub">입력, 출력, 검증, 실행 기록을 구조화해 모델 교체와 재현 가능한 비교를 지원합니다.</text>

  <g filter="url(#shadow)">
    <rect x="95" y="235" width="500" height="665" rx="30" fill="#fff"/>
    <rect x="95" y="235" width="500" height="90" rx="30" fill="#f6e7df"/>
    <path d="M95 295v30h500v-30" fill="#f6e7df"/>
    <text x="140" y="292" class="head">INPUT JSON</text>
    <text x="140" y="372" class="code">{</text>
    <text x="170" y="414" class="code">"business_name"</text><text x="390" y="414" class="label">가게명</text>
    <text x="170" y="464" class="code">"product_names"</text><text x="390" y="464" class="label">상품</text>
    <text x="170" y="514" class="code">"features"</text><text x="390" y="514" class="label">특징</text>
    <text x="170" y="564" class="code">"target_audiences"</text><text x="420" y="564" class="label">타깃</text>
    <text x="170" y="614" class="code">"channel"</text><text x="390" y="614" class="label">채널</text>
    <text x="170" y="664" class="code">"required_terms"</text><text x="410" y="664" class="label">필수어</text>
    <text x="170" y="714" class="code">"prohibited_terms"</text><text x="430" y="714" class="label">금지어</text>
    <text x="170" y="764" class="code">"copy_model"</text><text x="390" y="764" class="label">LLM</text>
    <text x="170" y="814" class="code">"image_model"</text><text x="390" y="814" class="label">이미지 모델</text>
    <text x="140" y="858" class="code">}</text>
  </g>

  <path d="M620 565 H750" stroke="#d7785a" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="640" y="505" width="90" height="52" rx="16" fill="#d7785a"/>
  <text x="659" y="539" style="font:800 17px Arial,sans-serif;fill:white">LLM</text>

  <g filter="url(#shadow)">
    <rect x="760" y="235" width="555" height="665" rx="30" fill="#fff"/>
    <rect x="760" y="235" width="555" height="90" rx="30" fill="#e2ece5"/>
    <path d="M760 295v30h555v-30" fill="#e2ece5"/>
    <text x="805" y="292" class="head">STRUCTURED OUTPUT JSON</text>
    <text x="805" y="372" class="code">{</text>
    <rect x="840" y="395" width="430" height="72" rx="15" fill="#f8f4ef"/>
    <text x="870" y="440" class="code">"marketing_strategy"</text>
    <rect x="840" y="482" width="430" height="72" rx="15" fill="#fff0ea"/>
    <text x="870" y="527" class="code">"headlines" · "body_copies"</text>
    <rect x="840" y="569" width="430" height="72" rx="15" fill="#edf4ef"/>
    <text x="870" y="614" class="code">"visual_brief"</text>
    <rect x="840" y="656" width="430" height="72" rx="15" fill="#f3eef6"/>
    <text x="870" y="701" class="code">"validation_check"</text>
    <rect x="840" y="743" width="430" height="72" rx="15" fill="#f8f4ef"/>
    <text x="870" y="788" class="code">"model" · "latency_ms"</text>
    <text x="805" y="858" class="code">}</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1440" y="235" width="380" height="665" rx="30" fill="#31483c"/>
    <text x="1485" y="292" class="why">왜 JSON인가?</text>
    <circle cx="1505" cy="383" r="22" fill="#d7785a"/><text x="1498" y="390" class="why">1</text>
    <text x="1545" y="376" class="why">모델 교체</text><text x="1545" y="408" style="font:500 17px 'Noto Sans KR','Malgun Gothic';fill:#cdd9d1">GPT와 로컬 LLM을 동일 기준으로</text>
    <circle cx="1505" cy="500" r="22" fill="#d7785a"/><text x="1498" y="507" class="why">2</text>
    <text x="1545" y="493" class="why">자동 검증</text><text x="1545" y="525" style="font:500 17px 'Noto Sans KR','Malgun Gothic';fill:#cdd9d1">Pydantic으로 누락·타입 검사</text>
    <circle cx="1505" cy="617" r="22" fill="#d7785a"/><text x="1498" y="624" class="why">3</text>
    <text x="1545" y="610" class="why">재현성</text><text x="1545" y="642" style="font:500 17px 'Noto Sans KR','Malgun Gothic';fill:#cdd9d1">입력·모델·시간·결과 저장</text>
    <circle cx="1505" cy="734" r="22" fill="#d7785a"/><text x="1498" y="741" class="why">4</text>
    <text x="1545" y="727" class="why">교차 평가</text><text x="1545" y="759" style="font:500 17px 'Noto Sans KR','Malgun Gothic';fill:#cdd9d1">단계별 모델 영향 비교</text>
  </g>

  <rect x="225" y="955" width="1470" height="64" rx="20" fill="#f2dfd5"/>
  <text x="310" y="996" style="font:700 22px 'Noto Sans KR','Malgun Gothic';fill:#6e473a">JSON은 저장 형식이 아니라 입력 → 생성 → 검수 → 평가를 연결하는 파이프라인 계약입니다.</text>
</svg>
