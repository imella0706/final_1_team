x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
    args:
      AIRFLOW_VERSION: "2.10.5"
      PYTHON_VERSION: "3.11"
  image: brandmate-airflow:2.10.5-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?set AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:?set AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: UTC
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?set AIRFLOW_ADMIN_USERNAME}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD}
    AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-BrandMate}
    AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-Admin}
    BRANDMATE_MOCK_GCS_BASE_DIR: /opt/airflow/mock_gcs
    BRANDMATE_AIRFLOW_GCS_CACHE_DIR: /opt/airflow/gcs_data_cache
    BRANDMATE_AIRFLOW_GCS_LOGS_PREFIX: ${BRANDMATE_AIRFLOW_GCS_LOGS_PREFIX:-gs://ssakda/projects/brandmate/logs/data_pipeline/airflow}
    BRANDMATE_SNS_TREND_PROCESSED_GCS_ROOT: ${BRANDMATE_SNS_TREND_PROCESSED_GCS_ROOT:-}
    BRANDMATE_SNS_TREND_VALIDATION_SCHEDULE: ${BRANDMATE_SNS_TREND_VALIDATION_SCHEDULE:-30 4 * * 3}
    BRANDMATE_SNS_TREND_SAME_VERSION_POLICY: ${BRANDMATE_SNS_TREND_SAME_VERSION_POLICY:-skip}
    YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    YOUTUBE_REGION_CODE: ${YOUTUBE_REGION_CODE:-KR}
    YOUTUBE_TOTAL_VIDEOS: ${YOUTUBE_TOTAL_VIDEOS:-100}
    YOUTUBE_PAGE_SIZE: ${YOUTUBE_PAGE_SIZE:-50}
    YOUTUBE_API_TIMEOUT: ${YOUTUBE_API_TIMEOUT:-15}
    YOUTUBE_API_RETRIES: ${YOUTUBE_API_RETRIES:-3}
    YOUTUBE_TOKENIZER: ${YOUTUBE_TOKENIZER:-regex}
    YOUTUBE_TIMEZONE: ${YOUTUBE_TIMEZONE:-Asia/Seoul}
    BRANDMATE_SNS_TREND_YOUTUBE_LANDING_SCHEDULE: ${BRANDMATE_SNS_TREND_YOUTUBE_LANDING_SCHEDULE:-40 18 * * 3}
    BRANDMATE_SNS_TREND_YOUTUBE_LANDING_LIMIT: ${BRANDMATE_SNS_TREND_YOUTUBE_LANDING_LIMIT:-100}
    BRANDMATE_SNS_TREND_GOGUMAFARM_LANDING_SCHEDULE: ${BRANDMATE_SNS_TREND_GOGUMAFARM_LANDING_SCHEDULE:-40 18 * * 3}
    BRANDMATE_SNS_TREND_GOGUMAFARM_CURATED_VERSION: ${BRANDMATE_SNS_TREND_GOGUMAFARM_CURATED_VERSION:-v3}
    BRANDMATE_SNS_TREND_GOGUMAFARM_DELAY: ${BRANDMATE_SNS_TREND_GOGUMAFARM_DELAY:-1.0}
    BRANDMATE_SNS_TREND_GOGUMAFARM_TIMEOUT: ${BRANDMATE_SNS_TREND_GOGUMAFARM_TIMEOUT:-15}
    BRANDMATE_SNS_TREND_GOGUMAFARM_RETRIES: ${BRANDMATE_SNS_TREND_GOGUMAFARM_RETRIES:-3}
    BRANDMATE_SNS_TREND_CAREET_LANDING_SCHEDULE: ${BRANDMATE_SNS_TREND_CAREET_LANDING_SCHEDULE:-40 18 * * 3}
    BRANDMATE_SNS_TREND_CAREET_CURATED_VERSION: ${BRANDMATE_SNS_TREND_CAREET_CURATED_VERSION:-v3}
    BRANDMATE_SNS_TREND_CAREET_DELAY: ${BRANDMATE_SNS_TREND_CAREET_DELAY:-1.5}
    BRANDMATE_SNS_TREND_CAREET_TIMEOUT: ${BRANDMATE_SNS_TREND_CAREET_TIMEOUT:-15}
    BRANDMATE_SNS_TREND_CAREET_RETRIES: ${BRANDMATE_SNS_TREND_CAREET_RETRIES:-3}
    NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
    NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
    BRANDMATE_AIRFLOW_ALERTS_ENABLED: ${BRANDMATE_AIRFLOW_ALERTS_ENABLED:-false}
    BRANDMATE_AIRFLOW_DISCORD_WEBHOOK_URL: ${BRANDMATE_AIRFLOW_DISCORD_WEBHOOK_URL:-}
    BRANDMATE_AIRFLOW_ALERT_TIMEOUT_SECONDS: ${BRANDMATE_AIRFLOW_ALERT_TIMEOUT_SECONDS:-5}
    BRANDMATE_REPO_ROOT: /opt/airflow
    BRANDMATE_AIRFLOW_INCLUDE_DIR: /opt/airflow/include
    CLOUDSDK_CONFIG: /home/airflow/.config/gcloud
    GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-ssakda}
    PYTHONPATH: /opt/airflow/include:/opt/airflow/apps/api:/opt/airflow/gather_data:/opt/airflow/gather_data/youtube
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/include:/opt/airflow/include:ro
    - ./gather_data:/opt/airflow/gather_data:ro
    - ./airflow/mock_gcs:/opt/airflow/mock_gcs
    - ./airflow/gcs_data_cache:/opt/airflow/gcs_data_cache
    - ${HOME}/.config/gcloud:/home/airflow/.config/gcloud:ro
    - ./apps/api:/opt/airflow/apps/api:ro
    # [Design Intent] Processed validation stays read-only by code path, but
    # Phase 4 landing collection must write crawler artifacts under data/landing.
    - ./data:/opt/airflow/data
    - airflow-logs-volume:/opt/airflow/logs
  # [Design Intent] Match the host UID while retaining the image's root group
  # permissions. The process is not root because its UID is never zero.
  user: "${AIRFLOW_UID:-50000}:0"

services:
  airflow-postgres:
    image: postgres:16
    environment:
      # [Design Intent] The metadata DB is network-internal and keeps its
      # existing local credentials so the current volume remains reusable.
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - airflow-postgres-db-volume:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        airflow users reset-password \
          --username "$${AIRFLOW_ADMIN_USERNAME}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
        || airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME}" \
          --firstname "$${AIRFLOW_ADMIN_FIRSTNAME}" \
          --lastname "$${AIRFLOW_ADMIN_LASTNAME}" \
          --role Admin \
          --email "$${AIRFLOW_ADMIN_EMAIL}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-postgres-db-volume:
  airflow-logs-volume:
