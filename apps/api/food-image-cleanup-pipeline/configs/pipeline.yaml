project:
  name: food-image-cleanup-pipeline
  version: 0.2.0
paths:
  input_dir: data/input
  mask_dir: data/masks
  intermediate_dir: data/intermediate
  output_dir: data/output
  report_dir: data/reports
  model_dir: models
  log_dir: logs
image:
  allowed_extensions:
  - .jpg
  - .jpeg
  - .png
  - .webp
  max_file_size_mb: 25
  max_long_side: 1536
  jpeg_quality: 95
quality:
  blur_threshold: 80.0
  dark_mean_threshold: 55.0
  bright_mean_threshold: 210.0
  low_contrast_std_threshold: 28.0
  clipping_ratio_threshold: 0.08
models:
  foreground_detector:
    enabled: true
    provider: yolo
    # 기본값은 학습한 음식 전용 YOLO11n 가중치다.
    # 기본 COCO YOLO11n을 쓰려면 active_profile을 coco_yolo11n으로 바꾼다.
    active_profile: food_specialized
    confidence_threshold: 0.25
    iou_threshold: 0.45
    image_size: 960
    max_detections: 100
    # 운영에서는 탐지 실패를 결과 생성으로 감추지 않는다. 연결 테스트에서만 true로 둔다.
    allow_center_fallback_for_diagnostics: false
    profiles:
      food_specialized:
        weights: models/best.pt
        target_classes: [food]
        food_classes: [food]
        container_classes: []
      coco_yolo11n:
        weights: models/yolo11n.pt
        target_classes: [banana, apple, orange, broccoli, carrot, sandwich, pizza, donut, cake, bowl, cup]
        food_classes: [banana, apple, orange, broccoli, carrot, sandwich, pizza, donut, cake]
        container_classes: [bowl, cup]
  segmenter:
    enabled: true
    provider: sam2
    # Tiny보다 경계 품질이 높은 SAM 2.1 Small을 기본 사용한다.
    weights: models/sam2.1_s.pt
    device: auto
  hq_sam:
    # Optional SAM-HQ candidate masks. The stable SAM2 mask remains the base;
    # SAM-HQ only patches small missing boundary pieces by default.
    enabled: true
    provider: transformers-sam-hq
    model_id: models/hq-sam
    device: auto
    selection_mode: patch_missing
    minimum_score_gain: 0.0
    multimask_output: true
    hq_token_only: true
    patch_missing:
      enabled: true
      max_patch_area_ratio: 0.03
      max_total_patch_area_ratio: 0.03
      only_inside_boxes: true
      only_near_sam_boundary: true
      boundary_dilation: 15
      min_component_area: 128
      food:
        max_patch_area_ratio: 0.03
        max_total_patch_area_ratio: 0.03
        boundary_dilation: 15
        min_component_area: 128
      container:
        max_patch_area_ratio: 0.015
        max_total_patch_area_ratio: 0.015
        boundary_dilation: 9
        min_component_area: 192
  grounding_dino_detector:
    # 음식·접시의 1차 개방형 어휘 탐지기. YOLO는 이 단계의 무검출만 보완한다.
    enabled: true
    provider: grounding-dino
    model_id: IDEA-Research/grounding-dino-tiny
    # `scripts.download_models --models grounding-dino`가 만든 모델 스냅샷 경로.
    # 코랩에서는 Drive의 이 폴더를 직접 읽어 매 실행마다 다시 받지 않는다.
    cache_dir: models/grounding-dino
    device: auto
    box_threshold: 0.28
    text_threshold: 0.22
    prompts: [plate, dish, bowl, food, meal, bread, cake, dessert]
  removal_detector:
    enabled: true
    provider: yolo
    weights: models/yolo11n.pt
    target_classes:
    - fork
    - knife
    - spoon
    - cup
    - bowl
  inpainter:
    enabled: true
    provider: big-lama
    weights: models/big-lama.pt
    device: auto
    mask_dilation: 9
  semantic_validator:
    enabled: true
    provider: openclip
    model_name: ViT-B-32
    pretrained: laion2b_s34b_b79k
    cache_dir: models/openclip
    device: auto
    minimum_similarity: 0.8
  matting:
    enabled: false
    provider: birefnet
    model_id: ZhengPeng7/BiRefNet_HR
    cache_dir: models/birefnet
    device: auto
    input_size: 1024
    # BiRefNet은 SAM 구조 마스크의 미세 보정만 담당하며 품질 검사 실패 시 SAM으로 되돌린다.
    threshold: 0.50
    # 전경 경계는 7~9px 수준으로 부드럽게 전환한다.
    feather_kernel: 9
    allowed_dilation: 11
    minimum_iou: 0.55
    minimum_area_ratio: 0.60
    maximum_area_ratio: 1.40
    maximum_extra_components: 2
    # BiRefNet이 거부돼도 SAM 마스크의 작은 잡음과 내부 투명 구멍은 보정한다.
    sam_closing_kernel: 9
    sam_min_component_area: 64
    sam_fill_holes: true
  foreground_protection:
    dilation: 11
  plate_mask:
    # 원본 접시 외곽을 별도 레이어로 보존한다. 허용 범위 안의 원형·타원형 윤곽만 보완한다.
    enabled: true
    minimum_area_ratio: 0.08
    maximum_aspect_ratio: 1.65
    minimum_ellipse_iou: 0.65
    maximum_ellipse_area_ratio: 1.35
    # 접시 외곽의 작은 결손은 원본 RGB를 유지한 채 알파만 제한적으로 복구한다.
    edge_repair_kernel: 7
  plate_preservation:
    # 접시 레이어는 원본 픽셀을 그대로 보존한다. BiRefNet의 일반 feathering을
    # 접시 외곽에 적용하지 않아 접시 테두리가 투명해지는 현상을 막는다.
    feather_kernel: 5
    minimum_coverage: 0.995
    maximum_internal_gap_ratio: 0.002
    validation_erosion_px: 2
  preserved_container_blur:
    # preserve_original_plate mode only. Blurs visible plate/container pixels while protecting food pixels.
    enabled: true
    blur_kernel: 9
    sigma: 0.0
    opacity: 1.0
    mask_feather_kernel: 9
    food_protection_dilation: 11
  foreground_cleanup:
    # Removes detached foreground islands such as cutlery that SAM sometimes keeps in alpha.
    enabled: true
    anchor_dilation: 15
    min_component_area: 128
  plate_edge_repair:
    # preserve_original_plate mode only. Repairs small food/skewer intrusions
    # on the preserved plate rim so the plate edge does not look cut.
    enabled: true
    ring_width: 28
    food_core_erosion: 17
    close_kernel: 5
    max_component_area: 24000
    inpaint_radius: 7.0
    method: telea
    restore_rim_line: true
    rim_line_width: 5
    restore_inner_rim_line: true
    inner_rim_line_width: 5
    inner_rim_line_inset: 22
    color_aligned_rim_enabled: true
    color_aligned_rim_line_width: 5
    color_aligned_rim_inset_min: 4
    color_aligned_rim_inset_max: 42
    color_aligned_rim_inset_step: 2
    color_aligned_rim_top_ratio: 0.36
    color_aligned_rim_allow_food_overlap: false
    color_aligned_rim_min_overlap_pixels: 32
    rim_line_target_dilation: 9
    rim_line_min_samples: 128
    rim_line_opacity: 0.0
    rim_line_feather_kernel: 7
    rim_line_bridge_occlusions: true
    rim_line_bridge_dilation: 65
    rim_line_bridge_top_ratio: 0.34
    rim_line_bridge_horizontal_margin: 42
    rim_missing_detection_enabled: true
    rim_missing_top_ratio: 0.34
    rim_missing_color_distance: 42.0
    rim_missing_anchor_dilation: 95
    rim_missing_close_kernel: 11
    rim_missing_min_component_area: 12
    rim_color_interpolation_enabled: true
    rim_color_interpolation_distance: 48.0
    rim_color_interpolation_observed_dilation: 5
    rim_color_interpolation_inpaint_radius: 5.0
    rim_color_interpolation_min_pixels: 96
    rim_missing_surface_fill_enabled: true
    rim_missing_surface_top_ratio: 0.34
    rim_missing_surface_dilation: 17
    rim_missing_surface_close_kernel: 9
    rim_missing_surface_sample_dilation: 37
    rim_missing_surface_inpaint_radius: 9.0
    rim_missing_surface_min_pixels: 256
    rim_missing_surface_opacity: 0.92
    rim_missing_surface_feather_kernel: 7
    rim_missing_core_blend_enabled: false
    rim_missing_core_opacity: 0.94
    rim_missing_core_feather_kernel: 3
    synthetic_rim_bridge_enabled: true
    synthetic_rim_bridge_top_ratio: 0.30
    synthetic_rim_bridge_dilation: 95
    synthetic_rim_bridge_horizontal_margin: 64
    synthetic_rim_bridge_connect_full_top: true
    synthetic_rim_bridge_dilate: true
    synthetic_rim_bridge_extra_width: 3
    synthetic_rim_bridge_opacity: 0.98
    synthetic_rim_bridge_feather_kernel: 3
    synthetic_rim_band_enabled: false
    synthetic_rim_band_width: 5
    synthetic_rim_band_top_ratio: 0.30
    synthetic_rim_band_opacity: 0.62
    synthetic_rim_band_feather_kernel: 7
    synthetic_rim_band_allow_food_overlap: false
    synthetic_rim_color_min_samples: 48
    synthetic_rim_color_saturation_min: 45
    synthetic_rim_color_value_min: 30
    synthetic_rim_color_value_max: 210
    synthetic_rim_color_hue_window: 14
    synthetic_rim_color_hue_min: 35
    synthetic_rim_color_hue_max: 95
    plate_mask_rim_completion_enabled: false
    plate_mask_rim_completion_top_ratio: 0.30
    plate_mask_rim_completion_observed_dilation: 7
    plate_mask_rim_completion_close_kernel: 9
    plate_mask_rim_completion_expand: true
    plate_mask_rim_completion_width: 5
    plate_mask_rim_completion_opacity: 0.88
    plate_mask_rim_completion_feather_kernel: 5
    plate_mask_rim_completion_allow_food_overlap: false
    plate_mask_rim_completion_food_core_erosion: 31
  generated_plate_composition:
    # 기본 모드(generated_plate): 원본 접시·식탁보는 제거하고 음식만 생성 배경의 빈 접시에 배치한다.
    # 기존 원본 접시를 유지해야 하면 mode를 preserve_original_plate로 바꾼다.
    enabled: true
    mode: preserve_original_plate
    # 생성 배경에서 중앙 접시를 찾지 못한 후보는 사용하지 않는다.
    # food_visible 분할 결과가 없으면 원본 접시가 다시 전경에 섞일 수 있으므로 저장하지 않는다.
    require_food_visible_mask: true
    minimum_plate_score: 0.45
    # 음식 전경의 짧은 변을 생성 접시 짧은 변의 56%로 배치한다.
    food_width_ratio_of_plate: 0.56
    minimum_food_width_ratio: 0.12
    maximum_food_width_ratio: 0.42
  plate_segmenter:
    # CVAT 라벨로 학습한 YOLO11-seg 접시 전용 모델이다. 가중치를 만든 뒤에만
    # enabled를 true로 바꾼다. 그 전에는 기존 SAM + 기하학 보완을 사용한다.
    enabled: false
    provider: yolo-seg
    weights: models/yolo11n_plate_seg.pt
    confidence_threshold: 0.25
    iou_threshold: 0.45
    image_size: 1024
    device: auto
    plate_class: plate_full
    food_class: food_visible
  camera_angle_classifier:
    # 학습된 EfficientNet-B0가 원본 음식 사진을 top 또는 45로 분류한다.
    # 네이버 채널·로컬·코랩의 배경 프롬프트 선택에서 동일하게 사용된다.
    enabled: true
    provider: torchvision-efficientnet-b0
    weights: models/efficientnet_best.pt
    device: auto
    minimum_confidence: 0.60
    # 낮은 확률에서도 모델의 최고 확률 클래스를 사용하되 보고서에 low_confidence를 남긴다.
    fallback_on_low_confidence: false
    fallback_angle: 45
  background_generator:
    enabled: true
    provider: sana-1.6b
    device: auto
    seed: 42
    candidate_count: 3
    max_candidate_attempts: 12
    # 생성 후보 중 음식이 없고, 중앙이 비어 있으며 원본과 색온도가 가까운 후보를 선택한다.
    candidate_selection_enabled: true
    providers:
      sana-1.6b:
        model_id: Efficient-Large-Model/Sana_1600M_1024px_BF16_diffusers
        cache_dir: models/sana-1.6b
        steps: 20
        guidance_scale: 5.0
      flux-schnell:
        model_id: black-forest-labs/FLUX.1-schnell
        cache_dir: models/flux-schnell
        steps: 4
        guidance_scale: 0.0
  background_audit_detector:
    enabled: true
    provider: yolo
    weights: models/yolo11n.pt
    confidence_threshold: 0.20
    iou_threshold: 0.45
    image_size: 960
    max_detections: 100
    target_classes: [banana, apple, orange, broccoli, carrot, sandwich, pizza, donut, cake, bowl, cup, fork, knife, spoon]
  foreground_placement:
    # 접시/음식 전경을 결과 캔버스 너비의 55~70% 범위로 조절한다.
    top_width_ratio: 0.40
    angle_45_width_ratio: 0.48
    safe_padding_px: 28
    canvas_margin_px: 42
    alpha_crop_threshold: 1
  contact_shadow:
    enabled: true
    vertical_offset: 8
    horizontal_offset: 3
    blur_radius: 19
    opacity: 0.22
  harmonization:
    enabled: true
    max_brightness_delta: 12
    max_contrast_delta: 0.1
    max_saturation_delta: 0.08
    max_hue_shift_degree: 3
validation:
  max_brightness_delta: 35.0
  max_contrast_delta: 35.0
  max_blur_score_drop_ratio: 0.2
