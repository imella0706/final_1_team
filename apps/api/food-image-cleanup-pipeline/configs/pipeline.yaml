project:
  name: food-image-cleanup-pipeline
  version: 0.2.0
paths:
  input_dir: data/input
  mask_dir: data/masks
  intermediate_dir: data/intermediate
  output_dir: data/output
  report_dir: data/reports
  model_dir: models
  log_dir: logs
image:
  allowed_extensions:
  - .jpg
  - .jpeg
  - .png
  - .webp
  max_file_size_mb: 25
  max_long_side: 1536
  jpeg_quality: 95
quality:
  blur_threshold: 80.0
  dark_mean_threshold: 55.0
  bright_mean_threshold: 210.0
  low_contrast_std_threshold: 28.0
  clipping_ratio_threshold: 0.08
models:
  foreground_detector:
    enabled: true
    provider: yolo
    # 기본값은 학습한 음식 전용 YOLO11n 가중치다.
    # 기본 COCO YOLO11n을 쓰려면 active_profile을 coco_yolo11n으로 바꾼다.
    active_profile: food_specialized
    confidence_threshold: 0.25
    iou_threshold: 0.45
    image_size: 960
    max_detections: 100
    # 운영에서는 탐지 실패를 결과 생성으로 감추지 않는다. 연결 테스트에서만 true로 둔다.
    allow_center_fallback_for_diagnostics: false
    profiles:
      food_specialized:
        weights: models/best.pt
        target_classes: [food]
        food_classes: [food]
        container_classes: []
      coco_yolo11n:
        weights: models/yolo11n.pt
        target_classes: [banana, apple, orange, broccoli, carrot, sandwich, pizza, donut, cake, bowl, cup]
        food_classes: [banana, apple, orange, broccoli, carrot, sandwich, pizza, donut, cake]
        container_classes: [bowl, cup]
  segmenter:
    enabled: true
    provider: sam2
    # Tiny보다 경계 품질이 높은 SAM 2.1 Small을 기본 사용한다.
    weights: models/sam2.1_s.pt
    device: auto
  hq_sam:
    # Optional SAM-HQ candidate masks. The stable SAM2 mask remains the base;
    # SAM-HQ only patches small missing boundary pieces by default.
    enabled: true
    provider: transformers-sam-hq
    model_id: models/hq-sam
    device: auto
    selection_mode: patch_missing
    minimum_score_gain: 0.0
    multimask_output: true
    hq_token_only: true
    patch_missing:
      enabled: true
      max_patch_area_ratio: 0.03
      max_total_patch_area_ratio: 0.03
      only_inside_boxes: true
      only_near_sam_boundary: true
      boundary_dilation: 15
      min_component_area: 128
      food:
        max_patch_area_ratio: 0.03
        max_total_patch_area_ratio: 0.03
        boundary_dilation: 15
        min_component_area: 128
      container:
        max_patch_area_ratio: 0.015
        max_total_patch_area_ratio: 0.015
        boundary_dilation: 9
        min_component_area: 192
  grounding_dino_detector:
    # 음식·접시의 1차 개방형 어휘 탐지기. YOLO는 이 단계의 무검출만 보완한다.
    enabled: true
    provider: grounding-dino
    model_id: IDEA-Research/grounding-dino-tiny
    # `scripts.download_models --models grounding-dino`가 만든 모델 스냅샷 경로.
    # 코랩에서는 Drive의 이 폴더를 직접 읽어 매 실행마다 다시 받지 않는다.
    cache_dir: models/grounding-dino
    device: auto
    box_threshold: 0.28
    text_threshold: 0.22
    prompts:
    - plate
    - dish
    - bowl
    - food
    - meal
    - bread
    - cake
    - dessert
    - wooden skewer
    - food skewer
    - chopstick
  removal_detector:
    enabled: true
    provider: yolo
    weights: models/yolo11n.pt
    target_classes:
    - fork
    - knife
    - spoon
    - cup
    - bowl
  inpainter:
    enabled: true
    provider: big-lama
    weights: models/big-lama.pt
    device: auto
    mask_dilation: 9
  semantic_validator:
    enabled: true
    provider: openclip
    model_name: ViT-B-32
    pretrained: laion2b_s34b_b79k
    cache_dir: models/openclip
    device: auto
    minimum_similarity: 0.8
  matting:
    enabled: false
    provider: birefnet
    model_id: ZhengPeng7/BiRefNet_HR
    cache_dir: models/birefnet
    device: auto
    input_size: 1024
    # BiRefNet은 SAM 구조 마스크의 미세 보정만 담당하며 품질 검사 실패 시 SAM으로 되돌린다.
    threshold: 0.50
    # 전경 경계는 7~9px 수준으로 부드럽게 전환한다.
    feather_kernel: 9
    allowed_dilation: 11
    minimum_iou: 0.55
    minimum_area_ratio: 0.60
    maximum_area_ratio: 1.40
    maximum_extra_components: 2
    # BiRefNet이 거부돼도 SAM 마스크의 작은 잡음과 내부 투명 구멍은 보정한다.
    sam_closing_kernel: 9
    sam_min_component_area: 64
    sam_fill_holes: true
  foreground_protection:
    dilation: 11
  food_support_recovery:
    # 접시 경계를 실제로 가로지르고 SAM/HQ-SAM 후보에도 근거가 있는
    # 가늘고 긴 전경만 복구한다. 접시와 떨어진 수저는 보호하지 않는다.
    enabled: true
    preserve_mode_only: true
    maximum_outside_distance_ratio: 0.34
    inside_anchor_depth_ratio: 0.22
    minimum_line_length_ratio: 0.045
    maximum_line_length_ratio: 0.55
    maximum_line_gap_ratio: 0.025
    corridor_width_ratio: 0.008
    hough_threshold: 28
    canny_low: 35
    canny_high: 120
    candidate_dilation: 5
    expand_with_candidate_mask: false
    minimum_inside_samples: 4
    minimum_outside_samples: 5
    anchor_probe_extension_ratio: 0.04
    minimum_radial_alignment: 0.35
    continuation_maximum_angle_degrees: 8.0
    continuation_axis_distance_ratio: 0.015
    continuation_maximum_gap_ratio: 0.12
    continuation_passes: 2
    minimum_line_votes: 4
    base_food_guard_dilation: 5
    attachment_guard_dilation: 11
    minimum_outside_reach_ratio: 0.045
    minimum_component_aspect_ratio: 1.0
    minimum_component_candidate_overlap: 0.10
    allow_geometry_only: false
    geometry_only_minimum_outside_reach_ratio: 0.10
    geometry_only_minimum_peak_line_votes: 3
    # GroundingDINO + SAM2가 주 분할 경로다. GrabCut은 저대비 꼬치 끝을
    # 줄일 수 있어 기본값을 끄고, 배경 과보존 사례에서만 선택적으로 켠다.
    grabcut_refinement_enabled: false
    grabcut_padding: 9
    grabcut_allowed_dilation: 5
    grabcut_minimum_pixels: 24
    grabcut_strong_vote_threshold: 5
    grabcut_preserve_vote_threshold: 6
    grabcut_minimum_seed_pixels: 8
    grabcut_iterations: 2
    grabcut_minimum_retained_ratio: 0.25
    grabcut_maximum_growth_ratio: 1.20
    minimum_component_area: 12
    maximum_component_plate_area_ratio: 0.025
    maximum_total_plate_area_ratio: 0.04
  plate_mask:
    # 원형·타원형은 ellipse로, 사각·비정형 용기는 실제 contour로 보완한다.
    # 형태 신뢰도가 낮으면 완성 도형을 만들지 않고 원본 연결 성분을 유지한다.
    enabled: true
    minimum_area_ratio: 0.08
    maximum_aspect_ratio: 1.65
    minimum_ellipse_iou: 0.65
    maximum_ellipse_area_ratio: 1.35
    minimum_shape_confidence: 0.60
    contour_completion_enabled: true
    minimum_contour_solidity: 0.72
    minimum_rectangularity: 0.78
    maximum_contour_area_ratio: 1.25
    polygon_epsilon_ratio: 0.025
    maximum_polygon_vertices: 6
    edge_repair_kernel: 7
  mask_quality:
    # 음식과 용기를 독립적으로 검수한다. preserve 모드는 실패 시 합성 림만
    # 비활성화하고, generated_plate는 음식 마스크 실패 시 안전하게 중단한다.
    reject_generated_plate_on_food_failure: true
    food:
      minimum_area_ratio: 0.002
      maximum_area_ratio: 0.70
      minimum_largest_component_ratio: 0.18
      maximum_border_touch_ratio: 0.20
      minimum_plate_overlap_ratio: 0.10
      minimum_confidence: 0.55
      border_width: 3
    plate:
      minimum_area_ratio: 0.03
      maximum_area_ratio: 0.85
      minimum_largest_component_ratio: 0.90
      maximum_border_touch_ratio: 0.12
      maximum_hole_ratio: 0.03
      minimum_solidity: 0.60
      maximum_expansion_ratio: 1.40
      minimum_confidence: 0.60
      border_width: 3
  plate_preservation:
    # 접시 레이어는 원본 픽셀을 그대로 보존한다. BiRefNet의 일반 feathering을
    # 접시 외곽에 적용하지 않아 접시 테두리가 투명해지는 현상을 막는다.
    feather_kernel: 5
    minimum_coverage: 0.995
    maximum_internal_gap_ratio: 0.002
    validation_erosion_px: 2
  preserved_container_blur:
    # preserve_original_plate mode only. Blurs visible plate/container pixels while protecting food pixels.
    enabled: true
    blur_kernel: 9
    sigma: 0.0
    opacity: 1.0
    mask_feather_kernel: 9
    food_protection_dilation: 11
  foreground_cleanup:
    # Removes detached foreground islands such as cutlery that SAM sometimes keeps in alpha.
    enabled: true
    anchor_dilation: 15
    min_component_area: 128
  plate_edge_repair:
    # preserve_original_plate mode only. Repairs small food/skewer intrusions
    # on the preserved plate rim so the plate edge does not look cut.
    enabled: true
    ring_width: 28
    food_core_erosion: 17
    close_kernel: 5
    max_component_area: 24000
    inpaint_radius: 7.0
    method: telea
    restore_rim_line: true
    rim_line_width: 5
    restore_inner_rim_line: false
    inner_rim_line_width: 5
    inner_rim_line_inset: 22
    # 이전 초록색 HSV 전용 경로는 비활성화한다. 아래 adaptive 관찰이
    # 실제 경계의 색상 군집과 밝기 기울기를 이미지마다 다시 측정한다.
    color_aligned_rim_enabled: false
    color_aligned_rim_line_width: 5
    color_aligned_rim_inset_min: 4
    color_aligned_rim_inset_max: 42
    color_aligned_rim_inset_step: 2
    color_aligned_rim_top_ratio: 0.36
    color_aligned_rim_allow_food_overlap: false
    color_aligned_rim_min_overlap_pixels: 32
    # Fit the repair geometry to real colored rim pixels. This prevents the
    # synthetic line from following a slightly different plate-mask ellipse.
    observed_rim_fit_enabled: false
    observed_rim_fit_line_width: 5
    observed_rim_fit_boundary_width: 52
    observed_rim_fit_plate_dilation: 9
    observed_rim_fit_min_component_area: 8
    observed_rim_fit_min_pixels: 256
    observed_rim_fit_observed_dilation: 7
    observed_rim_fit_min_overlap_ratio: 0.55
    observed_rim_fit_max_aspect_ratio: 1.35
    observed_rim_fit_min_area_ratio: 0.55
    observed_rim_fit_max_area_ratio: 1.05
    observed_rim_fit_max_center_shift_ratio: 0.08
    rim_line_target_dilation: 9
    rim_line_min_samples: 128
    rim_line_opacity: 0.0
    rim_line_feather_kernel: 7
    rim_line_bridge_occlusions: false
    rim_line_bridge_dilation: 65
    rim_line_bridge_top_ratio: 0.34
    rim_line_bridge_horizontal_margin: 42
    rim_missing_detection_enabled: false
    rim_missing_top_ratio: 0.34
    rim_missing_color_distance: 42.0
    rim_missing_anchor_dilation: 95
    rim_missing_close_kernel: 11
    rim_missing_min_component_area: 12
    rim_color_interpolation_enabled: true
    rim_color_interpolation_distance: 48.0
    rim_color_interpolation_observed_dilation: 5
    rim_color_interpolation_inpaint_radius: 5.0
    rim_color_interpolation_min_pixels: 96
    rim_missing_surface_fill_enabled: false
    rim_missing_surface_top_ratio: 0.34
    rim_missing_surface_dilation: 17
    rim_missing_surface_close_kernel: 9
    rim_missing_surface_sample_dilation: 37
    rim_missing_surface_inpaint_radius: 9.0
    rim_missing_surface_min_pixels: 256
    rim_missing_surface_opacity: 0.92
    rim_missing_surface_feather_kernel: 7
    rim_missing_core_blend_enabled: false
    rim_missing_core_opacity: 0.94
    rim_missing_core_feather_kernel: 3
    quality_gate_enabled: true
    adaptive_rim_observation:
      enabled: true
      line_width: 5
      boundary_width: 48
      plate_guard_dilation: 12
      gradient_percentile: 68.0
      minimum_gradient: 18.0
      color_cluster_count: 4
      minimum_observed_pixels: 96
      observed_dilation: 7
      expected_line_dilation: 15
      food_core_erosion: 9
      color_contrast_scale: 90.0
      minimum_confidence: 0.53
      maximum_ellipse_aspect_ratio: 2.2
      minimum_ellipse_area_ratio: 0.45
      maximum_ellipse_area_ratio: 1.20
      maximum_center_shift_ratio: 0.12
    # 관측된 실제 림 픽셀은 합성 색보다 우선해 원본 RGB로 복원하고,
    # 접시 마스크 바깥의 실제 림만 알파에 제한적으로 추가한다.
    observed_source_rim_preservation_enabled: true
    observed_source_rim_dilation: 3
    observed_source_rim_feather_kernel: 3
    protected_detail_guard_width: 5
    protected_detail_feather_kernel: 3
    synthetic_rim_bridge_enabled: true
    synthetic_rim_bridge_mode: observed_contour_gap
    synthetic_rim_bridge_top_ratio: 0.30
    synthetic_rim_bridge_dilation: 45
    synthetic_rim_bridge_horizontal_margin: 64
    synthetic_rim_bridge_connect_full_top: false
    synthetic_rim_bridge_gap_observed_dilation: 7
    synthetic_rim_bridge_gap_anchor_close_kernel: 5
    synthetic_rim_bridge_gap_min_width: 3
    synthetic_rim_bridge_gap_max_width: 280
    synthetic_rim_bridge_gap_min_length: 3
    synthetic_rim_bridge_gap_max_length: 160
    synthetic_rim_bridge_gap_max_count: 4
    synthetic_rim_bridge_gap_max_total_fraction: 0.16
    # 타원 접시는 측면 음식 위에 짧은 선이 생기지 않도록 상단 림만 보완한다.
    # 사각·비정형 용기는 실제 contour 전체에서 보수적으로 결손을 찾는다.
    synthetic_rim_bridge_ellipse_top_only: true
    synthetic_rim_bridge_ellipse_top_ratio: 0.36
    synthetic_rim_bridge_gap_endpoint_margin: 4
    synthetic_rim_bridge_plate_outside_tolerance: 9
    synthetic_rim_bridge_dilate: true
    synthetic_rim_bridge_extra_width: 3
    synthetic_rim_bridge_max_plate_area_ratio: 0.008
    synthetic_rim_bridge_allow_food_overlap: false
    # 두꺼운 음식은 보호하되, 음식 마스크에 포함된 가는 꼬치는 림 복원 후보를 허용한다.
    synthetic_rim_bridge_allow_thin_foreground_overlap: true
    synthetic_rim_bridge_thin_foreground_radius: 4
    synthetic_rim_bridge_opacity: 0.98
    synthetic_rim_bridge_feather_kernel: 3
    plate_edge_alpha_extension_enabled: true
    plate_edge_alpha_extension_feather_kernel: 3
    synthetic_rim_band_enabled: false
    synthetic_rim_band_width: 5
    synthetic_rim_band_top_ratio: 0.30
    synthetic_rim_band_opacity: 0.62
    synthetic_rim_band_feather_kernel: 7
    synthetic_rim_band_allow_food_overlap: false
    synthetic_rim_color_min_samples: 48
    # 아래 HSV 값은 adaptive 관찰을 명시적으로 끈 경우에만 쓰는 레거시 fallback이다.
    synthetic_rim_color_saturation_min: 45
    synthetic_rim_color_value_min: 30
    synthetic_rim_color_value_max: 210
    synthetic_rim_color_hue_window: 14
    synthetic_rim_color_hue_min: 35
    synthetic_rim_color_hue_max: 95
    plate_mask_rim_completion_enabled: false
    plate_mask_rim_completion_top_ratio: 0.30
    plate_mask_rim_completion_observed_dilation: 7
    plate_mask_rim_completion_close_kernel: 9
    plate_mask_rim_completion_expand: true
    plate_mask_rim_completion_width: 5
    plate_mask_rim_completion_opacity: 0.88
    plate_mask_rim_completion_feather_kernel: 5
    plate_mask_rim_completion_allow_food_overlap: false
    plate_mask_rim_completion_food_core_erosion: 31
  generated_plate_composition:
    # 기본 모드(generated_plate): 원본 접시·식탁보는 제거하고 음식만 생성 배경의 빈 접시에 배치한다.
    # 기존 원본 접시를 유지해야 하면 mode를 preserve_original_plate로 바꾼다.
    enabled: true
    mode: preserve_original_plate
    # 생성 배경에서 중앙 접시를 찾지 못한 후보는 사용하지 않는다.
    # food_visible 분할 결과가 없으면 원본 접시가 다시 전경에 섞일 수 있으므로 저장하지 않는다.
    require_food_visible_mask: true
    minimum_plate_score: 0.45
    # 음식 전경의 짧은 변을 생성 접시 짧은 변의 56%로 배치한다.
    food_width_ratio_of_plate: 0.56
    minimum_food_width_ratio: 0.12
    maximum_food_width_ratio: 0.42
  plate_segmenter:
    # CVAT 라벨로 학습한 YOLO11-seg 접시 전용 모델이다. 가중치를 만든 뒤에만
    # enabled를 true로 바꾼다. 그 전에는 기존 SAM + 기하학 보완을 사용한다.
    enabled: false
    provider: yolo-seg
    weights: models/yolo11n_plate_seg.pt
    confidence_threshold: 0.25
    iou_threshold: 0.45
    image_size: 1024
    device: auto
    plate_class: plate_full
    food_class: food_visible
  camera_angle_classifier:
    # 학습된 EfficientNet-B0가 원본 음식 사진을 top 또는 45로 분류한다.
    # 네이버 채널·로컬·코랩의 배경 프롬프트 선택에서 동일하게 사용된다.
    enabled: true
    provider: torchvision-efficientnet-b0
    weights: models/efficientnet_best.pt
    device: auto
    minimum_confidence: 0.60
    # 낮은 확률에서도 모델의 최고 확률 클래스를 사용하되 보고서에 low_confidence를 남긴다.
    fallback_on_low_confidence: false
    fallback_angle: 45
  background_generator:
    enabled: true
    provider: sana-1.6b
    device: auto
    seed: 42
    candidate_count: 3
    max_candidate_attempts: 12
    # 생성 후보 중 음식이 없고, 중앙이 비어 있으며 원본과 색온도가 가까운 후보를 선택한다.
    candidate_selection_enabled: true
    providers:
      sana-1.6b:
        model_id: Efficient-Large-Model/Sana_1600M_1024px_BF16_diffusers
        cache_dir: models/sana-1.6b
        steps: 20
        guidance_scale: 5.0
      flux-schnell:
        model_id: black-forest-labs/FLUX.1-schnell
        cache_dir: models/flux-schnell
        steps: 4
        guidance_scale: 0.0
  background_audit_detector:
    enabled: true
    provider: yolo
    weights: models/yolo11n.pt
    confidence_threshold: 0.20
    iou_threshold: 0.45
    image_size: 960
    max_detections: 100
    target_classes: [banana, apple, orange, broccoli, carrot, sandwich, pizza, donut, cake, bowl, cup, fork, knife, spoon]
  foreground_placement:
    # 접시/음식 전경을 결과 캔버스 너비의 55~70% 범위로 조절한다.
    top_width_ratio: 0.40
    angle_45_width_ratio: 0.48
    safe_padding_px: 28
    canvas_margin_px: 42
    alpha_crop_threshold: 1
  contact_shadow:
    enabled: true
    vertical_offset: 8
    horizontal_offset: 3
    blur_radius: 19
    opacity: 0.22
  harmonization:
    enabled: true
    max_brightness_delta: 12
    max_contrast_delta: 0.1
    max_saturation_delta: 0.08
    max_hue_shift_degree: 3
validation:
  max_brightness_delta: 35.0
  max_contrast_delta: 35.0
  max_blur_score_drop_ratio: 0.2
